<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrenador de Oxidaciones</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    color:#1f4e79;
}

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    margin-top:20px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

button{
    background:#1976d2;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    margin:10px;
    font-size:16px;
}

button:hover{
    background:#125ca3;
}

.question{
    font-size:28px;
    font-weight:bold;
    margin-bottom:25px;
}

.options{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
    margin-top:20px;
}

.option{
    background:#eef4ff;
    border:2px solid #c6d8ff;
    border-radius:10px;
    padding:12px;
    cursor:pointer;
    user-select:none;
    font-size:18px;
}

.option.selected{
    background:#1976d2;
    color:white;
    border-color:#1976d2;
}

.correct{
    color:green;
    font-weight:bold;
    margin-top:15px;
}

.error{
    color:red;
    font-weight:bold;
    margin-top:15px;
}

.stats{
    margin-top:15px;
    font-size:18px;
}

#feedback{
    min-height:30px;
}

select{
    padding:10px;
    font-size:16px;
    margin:5px;
}

.progress{
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🧪 Entrenador de Oxidaciones</h1>

<div class="card">

<label><b>Nivel:</b></label>

<select id="level">

<option value="1">Oxidación +1</option>
<option value="2">Oxidación +2</option>
<option value="3">Oxidación +3</option>
<option value="4">Oxidación -1</option>
<option value="5">Oxidación -2</option>
<option value="6">+2,+3</option>
<option value="7">+1,+2</option>
<option value="8">+2,+4</option>
<option value="9">+2,+3,+6</option>
<option value="10">+2,+3,+4,+6,+7</option>
<option value="11">Nitrógeno</option>
<option value="12">Halógenos completos</option>
<option value="13">+3,+5</option>
<option value="14">Oro</option>
<option value="15">Oxidación +4</option>
<option value="99">Mezcla total</option>

</select>

<button onclick="startGame()">Empezar</button>

</div>

<div id="game" class="card" style="display:none;">

<div class="question" id="question"></div>

<div class="options" id="options"></div>

<button onclick="checkAnswer()">Comprobar</button>

<div id="feedback"></div>

<div class="stats">
✅ Aciertos: <span id="hits">0</span>
&nbsp;&nbsp;&nbsp;
❌ Fallos: <span id="misses">0</span>
</div>

<div class="progress" id="progress"></div>

</div>

</div>

<script>

const GROUPS = [
 
{
id:"1",
label:"+1",
correct:["H","Li","Na","K","Rb","Cs","Fr","Ag","NH4+"]
},
 
{
id:"2",
label:"+2",
correct:["Be","Mg","Ca","Sr","Ba","Ra","Zn","Cd"]
},
 
{
id:"3",
label:"+3",
correct:["Al","B","P","As","Sb","Bi"]
},
 
{
id:"4",
label:"-1",
correct:["H","F","Cl","Br","I"]
},
 
{
id:"5",
label:"-2",
correct:["O","S","Se","Te"]
},
 
{
id:"6",
label:"+2,+3",
correct:["Fe","Co","Ni"]
},
 
{
id:"7",
label:"+1,+2",
correct:["Cu","Hg"]
},
 
{
id:"8",
label:"+2,+4",
correct:["Sn","Pb","C","S","Se","Te"]
},
 
{
id:"9",
label:"+2,+3,+6",
correct:["Cr"]
},
 
{
id:"10",
label:"+2,+3,+4,+6,+7",
correct:["Mn"]
},
 
{
id:"11",
label:"+1,+2,+3,+4,+5",
correct:["N"]
},
 
{
id:"12",
label:"+1,+3,+5,+7",
correct:["Cl","Br","I"]
},
 
{
id:"13",
label:"+3,+5",
correct:["P","As","Sb","Bi"]
},
 
{
id:"14",
label:"+1,+3",
correct:["Au"]
},
 
{
id:"15",
label:"+4",
correct:["Si","C"]
}
 
];

const ALL_ELEMENTS = [
 
"H","F","Cl","Br","I",
"O","S","Se","Te",
"N","P",
"As","Sb","Bi",
"B","C","Si",
 
"Li","Na","K","Rb","Cs","Fr",
"Ag","NH4+",
 
"Be","Mg","Ca","Sr","Ba",
"Ra","Zn","Cd",
 
"Cu","Hg",
"Al",
"Au",
"Fe","Co","Ni",
"Ir",
"Cr",
"Mn",
"Sn","Pb"
 
];

let queue=[];
let wrongQuestions=[];
let currentQuestion=null;

let hits=0;
let misses=0;

function shuffle(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];

}

return array;
}

function startGame(){

hits=0;
misses=0;

wrongQuestions=[];

const level=document.getElementById("level").value;

if(level==="99"){

queue=GROUPS.map(g=>({...g}));

}else{

queue=[...GROUPS.filter(g=>g.id===level)];

}

shuffle(queue);

updateStats();

document.getElementById("game").style.display="block";

nextQuestion();

}

function nextQuestion(){

if(queue.length===0){

if(wrongQuestions.length>0){

alert("🔄 Repaso de errores");

queue=[...wrongQuestions];

wrongQuestions=[];

shuffle(queue);

}else{

alert(
"🏆 Nivel completado\n\n" +
"Aciertos: " + hits +
"\nFallos: " + misses
);

return;
}

}

currentQuestion=queue.shift();

generateQuestion();

}

function generateQuestion(){

document.getElementById("feedback").innerHTML="";

document.getElementById("question").textContent=
"Selecciona TODOS los elementos con oxidación " +
currentQuestion.label;

const optionsDiv=document.getElementById("options");

optionsDiv.innerHTML="";

let options=[...currentQuestion.correct];

let distractors=ALL_ELEMENTS.filter(
e=>!currentQuestion.correct.includes(e)
);

shuffle(distractors);

let needed=Math.max(
5,
10-currentQuestion.correct.length
);

options.push(...distractors.slice(0,needed));

shuffle(options);

options.forEach(el=>{

const div=document.createElement("div");

div.className="option";

div.textContent=el;

div.onclick=function(){

div.classList.toggle("selected");

};

optionsDiv.appendChild(div);

});

updateProgress();

}

function checkAnswer(){

const selected=[
...document.querySelectorAll(".option.selected")
].map(e=>e.textContent);

selected.sort();

const correct=[...currentQuestion.correct];

correct.sort();

const ok=
JSON.stringify(selected)===
JSON.stringify(correct);

if(ok){

hits++;

document.getElementById("feedback").innerHTML=
'<div class="correct">✅ Correcto</div>';

}else{

misses++;

wrongQuestions.push(currentQuestion);

document.getElementById("feedback").innerHTML=
'<div class="error">❌ Correctos: '+
correct.join(", ")+
'</div>';

}

updateStats();

setTimeout(nextQuestion,1500);

}

function updateStats(){

document.getElementById("hits").textContent=hits;

document.getElementById("misses").textContent=misses;

}

function updateProgress(){

document.getElementById("progress").textContent =
"Preguntas pendientes: " +
(queue.length+1);

}

</script>

</body>
</html>
